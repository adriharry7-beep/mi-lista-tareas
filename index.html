<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista de Tareas</title>
    <!-- Enlazamos el archivo de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Mis Tareas <span id="taskCounter" aria-live="polite">0 de 0</span></h1>
        <p>Organiza tu día paso a paso.</p>
        
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="active">Activas</button>
            <button class="filter-btn" data-filter="completed">Completadas</button>
        </div>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="¿Qué tienes que hacer hoy?">
            <button id="addBtn">Agregar</button>
            <button id="themeToggle" aria-label="Modo noche">🌙</button>
            <button id="exportBtn" aria-label="Exportar lista">📤</button>
        </div>

        <ul id="taskList">
            <!-- Aquí aparecerán las tareas dinámicamente -->
        </ul>
    </div>

    <!-- Enlazamos el archivo de lógica -->
    <script src="script.js"></script>
</body>
</html>
